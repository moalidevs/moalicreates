<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:block">
  <sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ true }}">
    <span style="display:block;margin-bottom:22px;font-family:'Martian Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.068em;line-height:1;text-transform:uppercase;opacity:.72"><span style="color:var(--accent)">+</span> {{ eyebrow }}</span>
  </sc-if>
  <h2 style="margin:0;font-size:inherit;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;text-transform:inherit;text-wrap:balance">
    <sc-if value="{{ hasAccent }}" hint-placeholder-val="{{ true }}">
      <span style="color:var(--accent)"><x-import component="DecryptedText" from="./DecryptedText.jsx" text="{{ accentWord }}" animate-on="view" sequential="{{ true }}" speed="{{ 40 }}" reveal-direction="start" use-original-chars-only="{{ false }}" hint-size="auto,auto"></x-import><span> </span></span>
    </sc-if>
    <x-import component="DecryptedText" from="./DecryptedText.jsx" text="{{ text }}" animate-on="view" sequential="{{ true }}" speed="{{ 40 }}" reveal-direction="start" use-original-chars-only="{{ false }}" hint-size="auto,auto"></x-import>
    <sc-if value="{{ hasLine2 }}" hint-placeholder-val="{{ true }}">
      <span style="display:block"><x-import component="DecryptedText" from="./DecryptedText.jsx" text="{{ line2 }}" animate-on="view" sequential="{{ true }}" speed="{{ 40 }}" reveal-direction="start" use-original-chars-only="{{ false }}" delay="{{ 260 }}" hint-size="auto,auto"></x-import></span>
    </sc-if>
  </h2>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:240},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Selected works&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accentWord&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const eyebrow = this.props.eyebrow || '';
    const accentWord = this.props.accentWord || '';
    const line2 = this.props.line2 || '';
    return {
      eyebrow, accentWord, line2,
      text: this.props.text || '',
      hasEyebrow: !!eyebrow,
      hasAccent: !!accentWord,
      hasLine2: !!line2
    };
  }
}
</script>
</body>
</html>
